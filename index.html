<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Human Motion Tracking</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <!-- MediaPipe libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <div id="scene-container"></div>
        <div id="video-container">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="webcam-overlay"></canvas>
        </div>
        <div class="controls">
            <button id="start-tracking">Start Tracking</button>
            <button id="toggle-video">Toggle Video</button>
            <button id="reset-pose">Reset Pose</button>
            <button id="toggle-debug">Toggle Debug</button>
        </div>
        <div class="debug-info" id="debug-info">Tracking status: Inactive</div>
        <div class="key-instructions">
            <div>Press 'S' to toggle skeleton visualization</div>
            <div>Press 'D' to toggle debug panel</div>
            <div>Press 'R' to reset pose</div>
        </div>
    </div>
    <div id="loading">Loading model and resources...</div>
    <script type="module" src="app.js"></script>

</html>
